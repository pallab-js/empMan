name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: macos-15
    strategy:
      matrix:
        destination:
          - "platform=macOS"
          - "platform=macOS,variant=Mac Catalyst"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build --configuration debug 2>&1 | xcpretty || swift build --configuration debug

      - name: Run tests
        run: swift test 2>&1 | xcpretty || swift test

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --reporter github-actions-logging

  release:
    name: Release Build
    runs-on: macos-15
    needs: [build, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build release
        run: swift build --configuration release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: GasGridManager-${{ github.sha }}
          path: .build/release/GasGridManager
          retention-days: 30
