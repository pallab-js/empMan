disabled_rules:
  - trailing_whitespace
  - todo
  - trailing_comma
  - statement_position
  - implicit_optional_initialization
  - force_unwrapping
  - empty_count
  - multiline_arguments
  - large_tuple
  - function_body_length

opt_in_rules:
  - closure_spacing
  - fatal_error_message
  - single_test_class
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces

excluded:
  - .build
  - .swiftpm
  - DerivedData

line_length:
  warning: 300
  error: 400

file_length:
  warning: 800
  error: 1200

type_body_length:
  warning: 500
  error: 800

identifier_name:
  min_length:
    warning: 1
    error: 1
  max_length:
    warning: 80
    error: 100
  excluded:
    - id
    - i
    - x
    - y
    - t
    - e
    - d
    - m
    - f
    - l
    - a
    - r
    - g
    - b
    - s
    - c
    - p
    - o
    - n
    - q

nesting:
  type_level: 5
  function_level: 6
